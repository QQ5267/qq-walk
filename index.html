<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ 原地走节拍器</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;margin:0;color:#17191f}.w{max-width:720px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px}.ds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}button{min-height:46px;border:1px solid #e5e7eb;background:#fff;border-radius:12px;font-size:15px;font-weight:650}button.on{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}button.p{background:#2563eb;color:white}.top{display:flex;justify-content:space-between;align-items:end;margin-top:20px}.big{font-size:42px;font-weight:750}.time{font-size:28px;font-weight:750}.mut{color:#6b7280;font-size:14px}.bar{height:12px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#2563eb;width:0}.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #eee;font-size:14px}.row.on{background:#dbeafe;font-weight:700}@media(max-width:480px){.ds{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="w"><h1>QQ 原地走节拍器</h1><div class="mut">5 / 10 / 15 / 20 / 30 分钟 · 每一声迈一步</div><div class="c">
<div class="ds" id="ds"></div><div class="top"><div><div class="mut">当前节奏</div><span class="big" id="bpm">90</span> <span class="mut">步/分钟</span></div><div style="text-align:right"><div class="mut">剩余时间</div><div class="time" id="t">10:00</div></div></div>
<div class="bar"><div class="fill" id="f"></div></div><h2 id="st">热身</h2><div class="mut" id="hint">小步、自然摆臂，不要高抬腿</div>
<div class="ctrl"><button class="p" id="start">开始</button><button id="pause" disabled>暂停</button><button id="reset">重置</button></div><div class="mut" id="msg" style="margin-top:12px">选好时间，点开始。</div></div><div class="c" id="sch"></div></div>
<script>
(()=>{const Q=[5,10,15,20,30],T=[[.2,90,"热身","小步、自然摆臂，不要高抬腿"],[.3,105,"稳定走","保持舒服节奏"],[.1,120,"稍快走","加快脚步，但仍能完整说话"],[.3,105,"稳定走","回到稳定节奏"],[.1,90,"放松","逐渐慢下来"]];let m=10,total=600,e=0,run=false,last=0,next=0,raf,audio,S=[];const $=x=>document.getElementById(x);function fmt(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}function build(){let c=0;S=T.map((x,i)=>{let d=i==4?total-c:Math.round(total*x[0]),o={start:c,end:c+d,bpm:x[1],title:x[2],hint:x[3]};c+=d;return o})}function ix(){let i=S.findIndex(s=>e<s.end);return i<0?4:i}function draw(){[...$("ds").children].forEach(b=>b.classList.toggle("on",+b.dataset.m===m));$("sch").innerHTML=S.map((s,i)=>`<div class="row" data-i="${i}"><span>${fmt(s.start)}–${fmt(s.end)} · ${s.title}</span><span>${s.bpm} BPM</span></div>`).join("");upd()}function upd(){let i=ix(),s=S[i];$("bpm").textContent=s.bpm;$("t").textContent=fmt(total-e);$("f").style.width=Math.min(100,e/total*100)+"%";$("st").textContent=s.title;$("hint").textContent=s.hint;[...$("sch").children].forEach((r,j)=>r.classList.toggle("on",j===i))}function beep(){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=720;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.055);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.06)}function loop(ts){if(!run)return;if(!last)last=ts;e+=Math.min(.1,(ts-last)/1000);last=ts;if(e>=total){e=total;run=false;upd();$("start").disabled=false;$("pause").disabled=true;$("start").textContent="再来一次";$("msg").textContent=`完成 ${m} 分钟 👍`;beep();return}let s=S[ix()],iv=60/s.bpm;if(!next||e>=next){beep();next=e+iv}upd();raf=requestAnimationFrame(loop)}async function go(){if(e>=total)e=0;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")await audio.resume();run=true;last=0;next=0;$("start").disabled=true;$("pause").disabled=false;$("msg").textContent=`进行中：${m} 分钟`;raf=requestAnimationFrame(loop)}function pause(){run=false;if(raf)cancelAnimationFrame(raf);$("start").disabled=false;$("pause").disabled=true;$("start").textContent="继续";$("msg").textContent="已暂停"}function reset(){run=false;if(raf)cancelAnimationFrame(raf);e=0;last=0;next=0;$("start").disabled=false;$("pause").disabled=true;$("start").textContent="开始";$("msg").textContent="选好时间，点开始。";upd()}Q.forEach(n=>{let b=document.createElement("button");b.textContent=n+"分钟";b.dataset.m=n;b.onclick=()=>{m=n;total=n*60;build();reset();draw()};$("ds").appendChild(b)});$("start").onclick=go;$("pause").onclick=pause;$("reset").onclick=reset;build();draw()})();
</script></body></html>
